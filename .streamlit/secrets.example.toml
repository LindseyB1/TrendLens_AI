# Copy this file to .streamlit/secrets.toml for local testing.
# Do NOT commit .streamlit/secrets.toml.

OPENAI_API_KEY = "replace_with_your_real_key_locally_or_in_streamlit_cloud"
OPENAI_MODEL = "gpt-4o-mini"

# Keep false for classroom/demo mode.
# Set true after configuring the [auth] section below.
TRENDLENS_AUTH_REQUIRED = false

# OIDC login settings for Streamlit authentication.
# MFA is handled by the user's Google/Microsoft/OIDC account settings.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "replace_with_a_long_random_secret"
client_id = "replace_with_google_or_microsoft_client_id"
client_secret = "replace_with_google_or_microsoft_client_secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
